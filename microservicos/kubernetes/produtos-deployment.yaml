apiVersion: apps/v1
kind: Deployment

metadata:
  name: produtos

spec:
  replicas: 3

  selector:
    matchLabels:
      app: produtos

  template:
    metadata:
      labels:
        app: produtos

    spec:
      containers:
        - name: produtos
          image: microservicos-produtos:latest
          imagePullPolicy: Never
          
          ports:
            - containerPort: 3001
          
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/produtos_db"